# Gemini-RTK Configuration

[ntrip]
host = "" # Leave empty for mock mode
port = 2101
mountpoint = "BASE1"
user = "user"
password = "password"

[rover]
file = "" # Path to RINEX observation file

[serial]
port = "" # /dev/ttyUSB0
baud_rate = 115200

[output]
enabled = false
format = "nmea" # nmea or rinex
destination = "stdout" # stdout, file, or port

