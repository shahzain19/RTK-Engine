name: CI Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake libeigen-dev

    - name: Build
      run: |
        mkdir build && cd build
        cmake ..
        make

    - name: Run Tests
      run: |
        cd build
        ./test_rtcm
        ./test_config
        ./test_rover_config
        ./test_ntrip
